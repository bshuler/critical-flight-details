name: Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.properties.outputs.version }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Get mod version
      id: properties
      run: |
        echo "version=$(grep 'mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' ')" >> $GITHUB_OUTPUT

    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mod-jar
        path: build/libs/*.jar
        retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: mod-jar
        path: build/libs/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: build/libs/*.jar
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    runs-on: ubuntu-latest
    needs: [build, release]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: mod-jar
        path: build/libs/

    - name: Get mod version
      id: version
      run: |
        echo "version=$(grep 'mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' ')" >> $GITHUB_OUTPUT
        echo "minecraft_version=$(grep 'minecraft_version' gradle.properties | cut -d'=' -f2 | tr -d ' ')" >> $GITHUB_OUTPUT

    - name: Publish to Modrinth and CurseForge
      uses: Kir-Antipov/mc-publish@v3.3
      with:
        # Modrinth configuration
        modrinth-id: ${{ secrets.MODRINTH_ID }}
        modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
        modrinth-featured: true

        # CurseForge configuration
        curseforge-id: ${{ secrets.CURSEFORGE_ID }}
        curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

        # GitHub Release (already done above, but can be enabled)
        # github-token: ${{ secrets.GITHUB_TOKEN }}

        # Common configuration
        name: "Critical Flight Display v${{ steps.version.outputs.version }}"
        version: ${{ steps.version.outputs.version }}
        version-type: release
        loaders: fabric
        game-versions: |
          ${{ steps.version.outputs.minecraft_version }}
        dependencies: |
          fabric-api | depends | *
        changelog-file: CHANGELOG.md
        files: build/libs/!(*-sources).jar

        # Retry configuration
        retry-attempts: 3
        retry-delay: 30000
