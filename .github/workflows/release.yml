name: Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.properties.outputs.version }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Get mod version
      id: properties
      run: |
        echo "version=$(grep 'mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' ')" >> $GITHUB_OUTPUT

    - name: Build all versions (Stonecutter)
      run: ./gradlew chiseledBuild

    - name: Upload all artifacts
      uses: actions/upload-artifact@v4
      with:
        name: all-jars
        path: |
          versions/*-fabric/build/libs/*.jar
          versions/*-neoforge/build/libs/*.jar
          versions/*-forge/build/libs/*.jar
        retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: all-jars
        path: jars/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: jars/**/*.jar
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # Fabric Publish Jobs (Matrix)
  # ==========================================
  publish-fabric:
    runs-on: ubuntu-latest
    needs: [build, release]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1.21.x
          - mc_version: "1.21.11"
            featured: true
          - mc_version: "1.21.10"
            featured: false
          - mc_version: "1.21.9"
            featured: false
          - mc_version: "1.21.8"
            featured: false
          - mc_version: "1.21.7"
            featured: false
          - mc_version: "1.21.6"
            featured: false
          - mc_version: "1.21.5"
            featured: false
          - mc_version: "1.21.4"
            featured: false
          - mc_version: "1.21.3"
            featured: false
          - mc_version: "1.21.2"
            featured: false
          - mc_version: "1.21.1"
            featured: false
          - mc_version: "1.21"
            featured: false
          # 1.20.x
          - mc_version: "1.20.6"
            featured: false
          - mc_version: "1.20.5"
            featured: false
          - mc_version: "1.20.4"
            featured: false
          - mc_version: "1.20.3"
            featured: false
          - mc_version: "1.20.2"
            featured: false
          - mc_version: "1.20.1"
            featured: false
          - mc_version: "1.20"
            featured: false
          # Legacy
          - mc_version: "1.19.4"
            featured: false
          - mc_version: "1.18.2"
            featured: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: all-jars
        path: jars/

    - name: Get mod version
      id: version
      run: |
        echo "version=$(grep 'mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' ')" >> $GITHUB_OUTPUT

    - name: Publish Fabric ${{ matrix.mc_version }} to Modrinth and CurseForge
      uses: Kir-Antipov/mc-publish@v3.3
      with:
        modrinth-id: ${{ secrets.MODRINTH_ID }}
        modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
        modrinth-featured: ${{ matrix.featured }}
        curseforge-id: ${{ secrets.CURSEFORGE_ID }}
        curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
        name: "Critical Flight Display v${{ steps.version.outputs.version }} (Fabric ${{ matrix.mc_version }})"
        version: "${{ steps.version.outputs.version }}+fabric-${{ matrix.mc_version }}"
        version-type: release
        loaders: fabric
        game-versions: "${{ matrix.mc_version }}"
        dependencies: |
          fabric-api | depends | *
        changelog-file: CHANGELOG.md
        files: jars/${{ matrix.mc_version }}-fabric/build/libs/!(*-sources).jar
        retry-attempts: 3
        retry-delay: 30000

  # ==========================================
  # NeoForge Publish Jobs (Matrix)
  # ==========================================
  publish-neoforge:
    runs-on: ubuntu-latest
    needs: [build, release]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1.21.x (all have NeoForge)
          - mc_version: "1.21.11"
            featured: true
          - mc_version: "1.21.10"
            featured: false
          - mc_version: "1.21.9"
            featured: false
          - mc_version: "1.21.8"
            featured: false
          - mc_version: "1.21.7"
            featured: false
          - mc_version: "1.21.6"
            featured: false
          - mc_version: "1.21.5"
            featured: false
          - mc_version: "1.21.4"
            featured: false
          - mc_version: "1.21.3"
            featured: false
          - mc_version: "1.21.2"
            featured: false
          - mc_version: "1.21.1"
            featured: false
          - mc_version: "1.21"
            featured: false
          # 1.20.x (1.20.2+ have NeoForge)
          - mc_version: "1.20.6"
            featured: false
          - mc_version: "1.20.5"
            featured: false
          - mc_version: "1.20.4"
            featured: false
          - mc_version: "1.20.3"
            featured: false
          - mc_version: "1.20.2"
            featured: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: all-jars
        path: jars/

    - name: Get mod version
      id: version
      run: |
        echo "version=$(grep 'mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' ')" >> $GITHUB_OUTPUT

    - name: Publish NeoForge ${{ matrix.mc_version }} to Modrinth and CurseForge
      uses: Kir-Antipov/mc-publish@v3.3
      with:
        modrinth-id: ${{ secrets.MODRINTH_ID }}
        modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
        modrinth-featured: ${{ matrix.featured }}
        curseforge-id: ${{ secrets.CURSEFORGE_ID }}
        curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
        name: "Critical Flight Display v${{ steps.version.outputs.version }} (NeoForge ${{ matrix.mc_version }})"
        version: "${{ steps.version.outputs.version }}+neoforge-${{ matrix.mc_version }}"
        version-type: release
        loaders: neoforge
        game-versions: "${{ matrix.mc_version }}"
        changelog-file: CHANGELOG.md
        files: jars/${{ matrix.mc_version }}-neoforge/build/libs/!(*-sources).jar
        retry-attempts: 3
        retry-delay: 30000

  # ==========================================
  # Forge Publish Jobs (Matrix)
  # ==========================================
  publish-forge:
    runs-on: ubuntu-latest
    needs: [build, release]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1.20.x (1.20-1.20.4 have Forge)
          - mc_version: "1.20.4"
          - mc_version: "1.20.3"
          - mc_version: "1.20.2"
          - mc_version: "1.20.1"
          - mc_version: "1.20"
          # Legacy
          - mc_version: "1.19.4"
          - mc_version: "1.18.2"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: all-jars
        path: jars/

    - name: Get mod version
      id: version
      run: |
        echo "version=$(grep 'mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' ')" >> $GITHUB_OUTPUT

    - name: Publish Forge ${{ matrix.mc_version }} to Modrinth and CurseForge
      uses: Kir-Antipov/mc-publish@v3.3
      with:
        modrinth-id: ${{ secrets.MODRINTH_ID }}
        modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
        curseforge-id: ${{ secrets.CURSEFORGE_ID }}
        curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
        name: "Critical Flight Display v${{ steps.version.outputs.version }} (Forge ${{ matrix.mc_version }})"
        version: "${{ steps.version.outputs.version }}+forge-${{ matrix.mc_version }}"
        version-type: release
        loaders: forge
        game-versions: "${{ matrix.mc_version }}"
        changelog-file: CHANGELOG.md
        files: jars/${{ matrix.mc_version }}-forge/build/libs/!(*-sources).jar
        retry-attempts: 3
        retry-delay: 30000
