name: Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.properties.outputs.version }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Get mod version
      id: properties
      run: |
        echo "version=$(grep 'mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' ')" >> $GITHUB_OUTPUT

    - name: Build all versions (Stonecutter)
      run: ./gradlew chiseledBuild

    - name: Upload all artifacts
      uses: actions/upload-artifact@v4
      with:
        name: all-jars
        path: |
          versions/*-fabric/build/libs/*.jar
          versions/*-neoforge/build/libs/*.jar
          versions/*-forge/build/libs/*.jar
        retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: all-jars
        path: jars/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: jars/**/*.jar
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish Fabric builds for all supported MC versions
  publish-fabric-1-21-4:
    runs-on: ubuntu-latest
    needs: [build, release]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: all-jars
        path: jars/

    - name: Get mod version
      id: version
      run: |
        echo "version=$(grep 'mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' ')" >> $GITHUB_OUTPUT

    - name: Publish Fabric 1.21.4 to Modrinth and CurseForge
      uses: Kir-Antipov/mc-publish@v3.3
      with:
        modrinth-id: ${{ secrets.MODRINTH_ID }}
        modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
        modrinth-featured: true
        curseforge-id: ${{ secrets.CURSEFORGE_ID }}
        curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
        name: "Critical Flight Display v${{ steps.version.outputs.version }} (Fabric 1.21.4)"
        version: "${{ steps.version.outputs.version }}+fabric-1.21.4"
        version-type: release
        loaders: fabric
        game-versions: "1.21.4"
        dependencies: |
          fabric-api | depends | *
        changelog-file: CHANGELOG.md
        files: jars/1.21.4-fabric/build/libs/!(*-sources).jar
        retry-attempts: 3
        retry-delay: 30000

