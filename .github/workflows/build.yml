name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all versions and loaders
        run: ./gradlew chiseledBuild

      - name: Run tests
        run: ./gradlew test

      - name: Collect build artifacts
        run: |
          mkdir -p release-jars
          find versions -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" -path "*/build/libs/*" -exec cp {} release-jars/ \;
          ls -la release-jars/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: critical-flight-details-${{ github.sha }}
          path: release-jars/*.jar
          retention-days: 14
