name: Build

on:
  push:
    branches: [ dev, test, main ]
  pull_request:
    branches: [ dev, test, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build all versions (Stonecutter)
      run: ./gradlew chiseledBuild

    - name: Upload Fabric artifacts
      uses: actions/upload-artifact@v4
      with:
        name: fabric-jars
        path: versions/*-fabric/build/libs/*.jar
        retention-days: 7

    - name: Upload NeoForge artifacts
      uses: actions/upload-artifact@v4
      with:
        name: neoforge-jars
        path: versions/*-neoforge/build/libs/*.jar
        retention-days: 7

    - name: Upload Forge artifacts
      uses: actions/upload-artifact@v4
      with:
        name: forge-jars
        path: versions/*-forge/build/libs/*.jar
        retention-days: 7

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Run tests
      run: ./gradlew test

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: build/reports/tests/
        retention-days: 7
