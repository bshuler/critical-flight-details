name: Pre-Release (Test Builds)

on:
  push:
    branches: [ dev, test, 'claude/**' ]
  workflow_dispatch:
    inputs:
      prerelease_tag:
        description: 'Pre-release tag name (e.g., v2.0.0-beta.1)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.properties.outputs.version }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Get mod version
      id: properties
      run: |
        echo "version=$(grep 'mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' ')" >> $GITHUB_OUTPUT

    - name: Build all versions (Stonecutter)
      run: ./gradlew chiseledBuild -x :compileJava -x :jar -x :processResources

    - name: Run tests
      run: ./gradlew test

    - name: Prepare release artifacts
      run: |
        mkdir -p release-jars
        # Copy all built JARs, excluding sources
        find versions -name "*.jar" ! -name "*-sources.jar" -path "*/build/libs/*" -exec cp {} release-jars/ \;
        # List what we're releasing
        echo "=== Release artifacts ==="
        ls -la release-jars/

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: all-mod-jars
        path: release-jars/*.jar
        retention-days: 30

  pre-release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: all-mod-jars
        path: release-jars/

    - name: Generate release tag
      id: tag
      run: |
        if [ -n "${{ github.event.inputs.prerelease_tag }}" ]; then
          TAG="${{ github.event.inputs.prerelease_tag }}"
        else
          # Generate tag from version + timestamp
          VERSION="${{ needs.build.outputs.version }}"
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          TAG="v${VERSION}-dev.${TIMESTAMP}"
        fi
        echo "tag=${TAG}" >> $GITHUB_OUTPUT
        echo "Generated tag: ${TAG}"

    - name: Create Pre-Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: "Test Build - ${{ steps.tag.outputs.tag }}"
        body: |
          ## Test Build - ${{ steps.tag.outputs.tag }}

          **This is a pre-release for testing purposes.**

          Built from branch: `${{ github.ref_name }}`
          Commit: `${{ github.sha }}`

          ### Included Builds

          | Minecraft | Fabric | NeoForge |
          |-----------|--------|----------|
          | 1.21.4    | ✅     | ✅       |
          | 1.20.6    | ✅     | ✅       |
          | 1.20.1    | ✅     | -        |
          | 1.19.4    | ✅     | -        |
          | 1.18.2    | ✅     | -        |

          ### Installation
          1. Download the JAR matching your Minecraft version and mod loader
          2. Place it in your `.minecraft/mods` folder
          3. Launch Minecraft and test!

          ### File Naming Convention
          - `critical-flight-details-X.X.X+fabric-1.21.4.jar` → Fabric for MC 1.21.4
          - `critical-flight-details-X.X.X+neoforge-1.21.4.jar` → NeoForge for MC 1.21.4
        files: release-jars/*.jar
        prerelease: true
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
