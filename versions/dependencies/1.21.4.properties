# Fabric API
fabric_version=0.119.4+1.21.4

# No yarn_mappings: Stonecraft's default (Mojang official mappings) is used for
# every loader here, matching the sibling critical-orientation mod. Setting
# yarn_mappings would force Yarn names onto Fabric and, via Architectury's
# NeoForge patch, a layered Yarn mapping onto NeoForge too - splitting the
# class/method names used across loaders for no benefit.

