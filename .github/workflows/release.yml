name: Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.properties.outputs.version }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Get mod version
      id: properties
      run: |
        echo "version=$(grep 'mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' ')" >> $GITHUB_OUTPUT

    - name: Build all versions (Stonecutter)
      run: ./gradlew chiseledBuild

    - name: Upload all artifacts
      uses: actions/upload-artifact@v4
      with:
        name: all-jars
        path: versions/*/build/libs/*.jar
        retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: all-jars
        path: jars/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: jars/**/*.jar
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-fabric:
    runs-on: ubuntu-latest
    needs: [build, release]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: all-jars
        path: jars/

    - name: Get mod version
      id: version
      run: |
        echo "version=$(grep 'mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' ')" >> $GITHUB_OUTPUT

    - name: Publish Fabric to Modrinth and CurseForge
      uses: Kir-Antipov/mc-publish@v3.3
      with:
        modrinth-id: ${{ secrets.MODRINTH_ID }}
        modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
        modrinth-featured: true
        curseforge-id: ${{ secrets.CURSEFORGE_ID }}
        curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
        name: "Critical Flight Display v${{ steps.version.outputs.version }} (Fabric)"
        version: "${{ steps.version.outputs.version }}+fabric"
        version-type: release
        loaders: fabric
        game-versions: |
          1.21.4
        dependencies: |
          fabric-api | depends | *
        changelog-file: CHANGELOG.md
        files: jars/*-fabric/build/libs/!(*-sources).jar
        retry-attempts: 3
        retry-delay: 30000

  publish-neoforge:
    runs-on: ubuntu-latest
    needs: [build, release]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: all-jars
        path: jars/

    - name: Get mod version
      id: version
      run: |
        echo "version=$(grep 'mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' ')" >> $GITHUB_OUTPUT

    - name: Publish NeoForge to Modrinth and CurseForge
      uses: Kir-Antipov/mc-publish@v3.3
      with:
        modrinth-id: ${{ secrets.MODRINTH_ID }}
        modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
        curseforge-id: ${{ secrets.CURSEFORGE_ID }}
        curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
        name: "Critical Flight Display v${{ steps.version.outputs.version }} (NeoForge)"
        version: "${{ steps.version.outputs.version }}+neoforge"
        version-type: release
        loaders: neoforge
        game-versions: |
          1.21.4
        changelog-file: CHANGELOG.md
        files: jars/*-neoforge/build/libs/!(*-sources).jar
        retry-attempts: 3
        retry-delay: 30000
